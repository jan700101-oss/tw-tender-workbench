name: 每日同步標案資料

on:
  schedule:
    - cron: "30 0 * * *"   # 08:30 台北時間
    - cron: "30 10 * * *"  # 18:30 台北時間
  push:
    branches: [main]
    paths:
      - "scripts/sync.mjs"
      - ".github/workflows/update-tenders.yml"
  workflow_dispatch:
    inputs:
      discover:
        description: "探索模式:額外輸出政府 XML 欄位樣本"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: sync-tenders
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 執行同步
        id: sync
        continue-on-error: true
        run: node scripts/sync.mjs ${{ inputs.discover == true && '--discover' || '' }}

      - name: 提交資料更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "沒有資料變更,不需提交"
          else
            git commit -m "自動同步標案資料 $(TZ=Asia/Taipei date +%F)"
            git push
          fi

      - name: 同步失敗時讓此次執行顯示為失敗(資料已保留上一版)
        if: steps.sync.outcome == 'failure'
        run: exit 1
