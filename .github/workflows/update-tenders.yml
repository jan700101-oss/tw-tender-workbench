name: Update government tender data

on:
  schedule:
    - cron: "25 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync official PCC data
        run: node scripts/sync-pcc-data.mjs
      - name: Commit data changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tenders.json
          git diff --cached --quiet || git commit -m "更新政府標案資料"
          git push
