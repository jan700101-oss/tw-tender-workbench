name: 同步目前可投標案件
on:
  schedule:
    - cron: "15 0 * * 1-5"
    - cron: "15 4 * * 1-5"
    - cron: "15 9 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-open-tenders
  cancel-in-progress: false
jobs:
  sync:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: 更新、官方驗證與失敗還原
        shell: powershell
        run: .\scripts\update-pcc-data.ps1
      - run: node --check docs/app.js
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/open-tenders.json docs/data/open-tenders-validation.json docs/index.html
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "更新目前可投標案件"
            git push origin main
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
