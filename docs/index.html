<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="更容易使用的台灣政府標案搜尋工具">
  <title>標案快搜｜台灣政府招標搜尋</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23176b4d'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='38' fill='white'%3E%E6%A8%99%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <style>@media (min-width:801px){.filters-row{grid-template-columns:1.2fr .8fr 1fr 1fr .8fr}}</style>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./"><span class="brand-mark">標</span><span>標案快搜<small>政府公開資料搜尋</small></span></a>
    <a class="source-link" href="https://web.pcc.gov.tw/tps/tp/OpenData/showList" target="_blank" rel="noopener noreferrer">官方資料來源 ↗</a>
  </header>
  <main>
    <section class="hero">
      <div><p class="eyebrow">TAIWAN TENDER SEARCH</p><h1>政府標案，<em>簡單搜尋。</em></h1><p>輸入案名、案號或機關，不用再跟政府網站複雜的查詢畫面搏鬥。</p></div>
      <aside class="sync-card"><span>資料狀態</span><strong id="syncSummary">正在載入官方資料…</strong><small id="syncTime"></small></aside>
    </section>

    <section class="search-panel" aria-label="標案搜尋">
      <form id="filters">
        <label class="main-search"><span>關鍵字、案號或機關</span><div><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.35-4.35m2.35-5.65a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/></svg><input id="query" type="search" placeholder="例如：室內裝修、台電、A115001" autocomplete="off"><button type="submit">搜尋標案</button></div></label>
        <div class="filters-row">
          <label><span>機關名稱</span><input id="agency" type="search" placeholder="輸入部分名稱即可"></label>
          <label><span>地區</span><select id="region"><option value="">所有地區</option></select></label>
          <label><span>採購類別</span><select id="category"><option value="">所有採購類別</option></select></label>
          <label><span>招標方式</span><select id="method"><option value="">所有招標方式</option></select></label>
          <label><span>截止狀態</span><select id="status"><option value="">全部狀態</option><option value="open">尚未截止</option><option value="closed">已截止</option></select></label>
        </div>
        <div class="form-actions"><button id="clear" type="button" class="quiet">清除條件</button><button id="save" type="button" class="quiet">儲存目前條件</button><span id="saveStatus" role="status"></span></div>
      </form>
    </section>

    <section class="result-head"><div><p id="resultCount">載入中</p><span id="range"></span></div><label>每頁顯示 <select id="pageSize"><option>25</option><option>50</option><option>100</option></select></label></section>
    <section id="results" class="results" aria-live="polite"><div id="loading" class="empty"><strong>正在準備標案資料</strong><span>第一次載入可能需要幾秒鐘。</span></div></section>
    <nav class="pagination" aria-label="搜尋結果分頁"><button id="prev" disabled>上一頁</button><span id="pageInfo">第 1 / 1 頁</span><button id="next" disabled>下一頁</button></nav>
    <section class="notice"><strong>資料說明</strong><p>本站使用政府電子採購網公開 XML。截止投標日來自官方欄位；「官方資料期間」是資料所屬半月檔案期間，不等同精確公告日。實際投標資訊與最新更正內容，請以政府電子採購網單案頁為準。</p></section>
  </main>
  <footer>標案快搜 · 資料來源：行政院公共工程委員會政府電子採購網</footer>
  <script src="./app.js" defer></script>
</body>
</html>
