<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>標案工務台 — 政府標案搜尋</title>
<meta name="description" content="臺灣政府採購標案搜尋:每日同步政府電子採購網公開資料,可搜尋、篩選、收藏。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='0.9em' font-size='90'%3E%F0%9F%93%8B%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <div class="wrap">
    <h1>標案工務台</h1>
    <p class="tagline">政府標案搜尋 · 資料來自<a href="https://web.pcc.gov.tw/tps/tp/OpenData/showList" target="_blank" rel="noopener">政府電子採購網公開資料</a></p>
  </div>
</header>

<div class="wrap">
  <div id="sync-banner" class="sync-banner" hidden></div>

  <section class="controls" aria-label="搜尋與篩選">
    <div class="row">
      <input id="q" type="search" placeholder="搜尋案名、案號、機關(空白分隔多個關鍵字,前面加 - 可排除)" autocomplete="off">
    </div>
    <div class="row filters">
      <div class="field">
        <label for="f-attr">類別</label>
        <select id="f-attr"><option value="">全部</option></select>
      </div>
      <div class="field">
        <label for="f-method">招標方式</label>
        <select id="f-method"><option value="">全部</option></select>
      </div>
      <div class="field">
        <label for="f-region">地區(推定)</label>
        <select id="f-region"><option value="">全部</option></select>
      </div>
      <div class="field">
        <label for="f-agency">機關</label>
        <input id="f-agency" type="search" placeholder="機關名稱關鍵字" autocomplete="off">
      </div>
      <div class="field">
        <label for="f-range">公告期間</label>
        <select id="f-range">
          <option value="3">近 3 個月</option>
          <option value="6">近 6 個月</option>
          <option value="12">近 12 個月</option>
          <option value="all">全部歷史</option>
          <option value="custom">自訂範圍</option>
        </select>
      </div>
      <div class="field custom-dates" id="custom-dates" hidden>
        <label for="f-start">起</label>
        <input id="f-start" type="date">
        <label for="f-end">迄</label>
        <input id="f-end" type="date">
      </div>
      <div class="field">
        <label for="f-sort">排序</label>
        <select id="f-sort">
          <option value="period-desc">公告期間:新 → 舊</option>
          <option value="deadline-asc">截止日:近 → 遠</option>
        </select>
      </div>
      <label class="check"><input id="f-open" type="checkbox" checked>僅顯示尚未截止（可投標）</label>
    </div>
    <div class="row saved">
      <button id="btn-save-search" class="btn" type="button">儲存目前條件</button>
      <button id="btn-clear" class="btn subtle" type="button">清除條件</button>
      <div id="saved-chips" class="chips"></div>
    </div>
  </section>

  <nav class="tabs" role="tablist">
    <button id="tab-all" class="tab active" role="tab" aria-selected="true" type="button">全部結果</button>
    <button id="tab-fav" class="tab" role="tab" aria-selected="false" type="button">★ 我的收藏 <span id="fav-count"></span></button>
  </nav>

  <p id="result-count" class="result-count" role="status"></p>
  <ul id="results" class="results"></ul>
  <div class="load-more-wrap"><button id="btn-more" class="btn" type="button" hidden>載入更多</button></div>
  <dialog id="detail-dialog"><div id="detail-content" class="detail-loading">正在載入標案詳情…</div></dialog>

  <section id="empty-state" class="empty-state" hidden></section>
</div>

<footer class="site-footer">
  <div class="wrap">
    <p>歷史資料同步自政府電子採購網公開半月檔 XML(官方提供之部分標案,顯示「公告期間」);
       近 35 天招標公告另由 <a href="https://pcc-api.openfun.app/" target="_blank" rel="noopener">g0v/OpenFun 標案 API</a>
       補齊每日完整清單(顯示精確「公告日」,截止日可在詳情視窗查看)。
       地區為依機關名稱與案名文字推定,僅供篩選參考。
       投標前請以<a href="https://web.pcc.gov.tw/" target="_blank" rel="noopener">政府電子採購網</a>正式公告為準。</p>
    <p id="footer-sync"></p>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
